<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>اختبار الإحصاء والعمليات الحسابية | منصة لامي التعليمية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#1d2433;--muted:#5f6b80;--brand:#1f5fbf;--brand2:#0f9d8a;--line:#dbe3ef;--ok:#15803d;--okbg:#e7f7ec;--bad:#c62828;--badbg:#fdecec;--sel:#e8f0fd}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,Tahoma,sans-serif;font-size:19px;line-height:1.8}
header{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;padding:26px 16px 30px;text-align:center}
header .brand{font-size:15px;opacity:.9;letter-spacing:.5px}
header h1{margin:4px 0 6px;font-size:28px;font-weight:800}
header p{margin:0;opacity:.92;font-size:16px}
main{max-width:860px;margin:-18px auto 40px;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:14px;box-shadow:0 2px 8px rgba(20,40,80,.05)}
.start label{font-weight:700;display:block;margin-bottom:6px}
.start input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.q .head{display:flex;gap:10px;align-items:flex-start}
.num{flex:0 0 auto;min-width:38px;height:38px;border-radius:10px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
.qt{flex:1;font-weight:700}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.opts.one{grid-template-columns:1fr}
.opt{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer;transition:.15s;background:#fff}
.opt:hover{border-color:var(--brand)}
.opt input{display:none}
.opt .l{flex:0 0 30px;height:30px;border-radius:50%;background:#1d2433;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
.opt.sel{background:var(--sel);border-color:var(--brand)}
.opt.sel .l{background:var(--brand)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.ok .l{background:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}.opt.bad .l{background:var(--bad)}
.done .opt{cursor:default}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;line-height:1.25;font-size:.92em}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 3px}
.fr>span:last-child{padding:0 3px}
.ex{white-space:nowrap}
.fig{display:flex;justify-content:center;margin:12px 0 4px}
.fig svg{max-width:100%;height:auto;direction:ltr}
.group{border-right:5px solid var(--brand2);background:#f2fbf9}
.group h3{margin:0 0 6px;font-size:19px}
table.t{border-collapse:collapse;margin:8px auto;font-size:17px}
table.t th,table.t td{border:1px solid #9aa7bb;padding:6px 16px;text-align:center}
table.t th{background:#e9eef7}
.bar{position:sticky;bottom:0;background:rgba(243,246,251,.96);padding:12px 0;display:flex;gap:10px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);flex-wrap:wrap}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:10px 22px;cursor:pointer;background:var(--brand);color:#fff}
button.sec{background:#fff;color:var(--brand);border:1.5px solid var(--brand)}
.prog{color:var(--muted);font-size:16px}
#result{display:none;text-align:center}
#result .score{font-size:44px;font-weight:800;color:var(--brand)}
.note{font-size:15px;color:var(--muted);margin-top:8px}
.fb{margin-top:8px;font-size:16px;font-weight:700}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
footer{text-align:center;color:var(--muted);font-size:14px;padding:10px 0 30px}
@media (max-width:560px){body{font-size:17px}.opts{grid-template-columns:1fr}header h1{font-size:23px}}
</style>
</head>
<body>
<header>
  <div class="brand">منصة لامي التعليمية · قدرات كمي</div>
  <h1>اختبار الإحصاء والعمليات الحسابية</h1>
  <p>عدد الأسئلة: <span id="qc"></span> سؤالًا · اختر إجابة واحدة لكل سؤال</p>
</header>
<main>
  <div class="card start">
    <label for="nm">اسم الطالب</label>
    <input id="nm" placeholder="اكتب اسمك هنا" autocomplete="name">
  </div>
  <div class="card" id="result">
    <div id="rname" style="font-weight:700"></div>
    <div class="score" id="score"></div>
    <div id="rmsg"></div>
    <div class="note">الإجابة الصحيحة مظللة بالأخضر، وإجابتك الخاطئة بالأحمر.</div>
  </div>
  <div id="quiz"></div>
  <div class="bar">
    <span class="prog" id="prog"></span>
    <span>
      <button class="sec" id="reset">إعادة الاختبار</button>
      <button id="submit">إنهاء الاختبار وعرض النتيجة</button>
    </span>
  </div>
</main>
<footer>منصة لامي التعليمية – أ. عماد عويس</footer>

<script>
const F=(a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const X=s=>`<span class="ex">${s}</span>`;

/* ---------- الرسومات ---------- */
const pieSchool=`<svg viewBox="0 0 300 300" width="300" font-family="Tajawal" text-anchor="middle">
<circle cx="150" cy="150" r="140" fill="#fff" stroke="#1f3b73" stroke-width="2"/>
${[ -100,-28,22,62,95,170 ].map(a=>{const r=a*Math.PI/180;return `<line x1="${150+50*Math.cos(r)}" y1="${150+50*Math.sin(r)}" x2="${150+140*Math.cos(r)}" y2="${150+140*Math.sin(r)}" stroke="#1f3b73" stroke-width="2"/>`}).join('')}
<circle cx="150" cy="150" r="50" fill="#dfe6f2" stroke="#1f3b73" stroke-width="2"/>
<g font-size="14" fill="#1f3b73" font-weight="700">
<text x="150" y="146">المعاقين</text><text x="150" y="166">٥ طلاب</text>
<text x="110" y="52">الأول الثانوي</text><text x="110" y="72">٢٠٠ طالب</text>
<text x="232" y="70">ثاني ثانوي</text><text x="232" y="88">«علمي»</text><text x="232" y="106">١٠٥ طلاب</text>
<text x="252" y="160">ثالث ثانوي</text><text x="252" y="178">«شرعي»</text><text x="252" y="196">٥٥ طالبًا</text>
<text x="160" y="232">ثاني ثانوي</text><text x="160" y="250">«شرعي»</text><text x="160" y="268">٤٥ طالبًا</text>
<text x="52" y="146">ثالث ثانوي</text><text x="52" y="164">«علمي»</text><text x="52" y="182">٩٠ طالبًا</text>
</g></svg>`;

const pieFrac=`<svg viewBox="0 0 220 220" width="210" font-family="Tajawal" text-anchor="middle">
<circle cx="110" cy="110" r="100" fill="#fff" stroke="#1d2433" stroke-width="2"/>
<line x1="110" y1="10" x2="110" y2="210" stroke="#1d2433" stroke-width="2"/>
<line x1="110" y1="110" x2="196.6" y2="160" stroke="#1d2433" stroke-width="2"/>
<line x1="110" y1="110" x2="23.4" y2="160" stroke="#1d2433" stroke-width="2"/>
<g font-size="20" font-weight="700" fill="#1d2433">
<text x="60" y="95">؟</text>
<text x="160" y="80">١</text><line x1="150" y1="86" x2="170" y2="86" stroke="#1d2433" stroke-width="2"/><text x="160" y="106">٣</text>
<text x="140" y="160">١</text><line x1="130" y1="166" x2="150" y2="166" stroke="#1d2433" stroke-width="2"/><text x="140" y="186">٦</text>
<text x="82" y="160">١</text><line x1="70" y1="166" x2="94" y2="166" stroke="#1d2433" stroke-width="2"/><text x="82" y="186">١٠</text>
</g></svg>`;

const pieNat=`<svg viewBox="0 0 240 220" width="230" font-family="Tajawal" text-anchor="middle">
<path d="M120 110 L120 10 A100 100 0 1 0 220 110 Z" fill="#cfe0f7" stroke="#1d2433" stroke-width="2"/>
<path d="M120 110 L220 110 A100 100 0 0 0 206.6 60 Z" fill="#fde9c4" stroke="#1d2433" stroke-width="2"/>
<path d="M120 110 L206.6 60 A100 100 0 0 0 120 10 Z" fill="#d6f2e3" stroke="#1d2433" stroke-width="2"/>
<rect x="120" y="98" width="12" height="12" fill="none" stroke="#1d2433" stroke-width="1.5"/>
<g font-size="15" font-weight="700" fill="#1d2433">
<text x="90" y="160">سعوديون</text><text x="152" y="58">أردنيون</text><text x="178" y="98">مصريون</text>
</g></svg>`;

function bars({groups,series,colors,max,step,w=560,h=270,title}){
  const L=40,R=10,T=title?40:16,B=62,cw=w-L-R,ch=h-T-B,gw=cw/groups.length,bw=Math.min(26,gw/(series.length+1.5));
  const hi=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
  let s=`<svg viewBox="0 0 ${w} ${h}" width="${w}" font-family="Tajawal">`;
  if(title)s+=`<text x="${w/2}" y="24" text-anchor="middle" font-size="16" font-weight="700">${title}</text>`;
  for(let v=0;v<=max;v+=step){const y=T+ch-ch*v/max;s+=`<line x1="${L}" y1="${y}" x2="${w-R}" y2="${y}" stroke="#c9d2e0"/><text x="${L-6}" y="${y+5}" text-anchor="end" font-size="13">${hi(v)}</text>`}
  groups.forEach((g,i)=>{const gx=L+gw*i+(gw-bw*g.v.length-4*(g.v.length-1))/2;
    g.v.forEach((v,j)=>{const bh=ch*v/max;s+=`<rect x="${gx+j*(bw+4)}" y="${T+ch-bh}" width="${bw}" height="${bh}" fill="${colors[j]}"/>`});
    s+=`<text x="${L+gw*i+gw/2}" y="${T+ch+22}" text-anchor="middle" font-size="15" font-weight="700">${g.n}</text>`});
  let lx=w/2+series.length*60;
  series.forEach((n,j)=>{const x=lx-j*120;s+=`<rect x="${x-14}" y="${h-24}" width="14" height="12" fill="${colors[j]}"/><text x="${x-20}" y="${h-13}" text-anchor="end" font-size="14">${n}</text>`});
  return s+'</svg>';
}
/* ترتيب الأيام من اليسار كما في الأصل: الأربعاء ... الأحد */
const barTrans=bars({groups:[{n:'الأربعاء',v:[50,70,70]},{n:'الثلاثاء',v:[30,60,70]},{n:'الاثنين',v:[50,70,60]},{n:'الأحد',v:[45,50,80]}],
  series:['النقل الخفيف','النقل الثقيل','النقل الخصوصي'].reverse(),colors:['#c9ccd3','#8a8f99','#3d424b'],max:100,step:20});
const barCo=bars({title:'نفقات وإيرادات إحدى الشركات',groups:[{n:'١٩٩٧',v:[6,4]},{n:'١٩٩٨',v:[3,1.5]},{n:'١٩٩٩',v:[5,3]},{n:'٢٠٠٠',v:[3,6]}],
  series:['النفقات','الإيرادات'],colors:['#3d424b','#8a8f99'],max:8,step:2,h:290});
// fix legend order for company chart: dark = الإيرادات
const barCo2=barCo.replace('>النفقات<','>__T__<').replace('>الإيرادات<','>النفقات<').replace('>__T__<','>الإيرادات<');

const tblHeight=`<table class="t"><tr><th>الطول بالسم</th><th>عدد الطلاب</th></tr><tr><td>١٦٠ – ١٦٩</td><td>٢٥</td></tr><tr><td>١٧٠ – ١٧٩</td><td>٣٥</td></tr></table>`;
const tblHobby=`<table class="t"><tr><th></th><th>قراءة</th><th>سباحة</th><th>مشي</th></tr><tr><th>النساء</th><td>١٠</td><td>١٢</td><td>٨</td></tr><tr><th>الرجال</th><td>٥</td><td>٧</td><td>٨</td></tr></table>`;

/* ---------- الأسئلة: a = رقم الإجابة الصحيحة (0=أ،1=ب،2=ج،3=د) ---------- */
const Q=[
{q:`ناتج ${X('(١٠٠ × ٠,١) + (١٠ × ٠,١) + (١٠ × ٠,١)')}`,o:['١٠','١٢','٣','١٠٢'],a:1},
{q:`ناتج ${X('٠,٥ × ٠,١ × ٠,٠١ × ١٠')}`,o:['٠,٠٠٥','٠,٥','٠,٠٥','٥٠'],a:0},
{q:`ناتج ضرب ${X('٤ × ٠,٤ × ٠,٠٤ × ٠,٠٠٢')}`,o:['٠,١٢٨','٠,٠١٢٨','٠,٠٠١٢٨','٠,٠٠٠١٢٨'],a:3},
{q:`ناتج ضرب ${X('٢ × ٠,٢ × ٠,٢ × ٠,٢')}`,o:['٠,٠٠١٦','٠,١٦','٠,٠١٦','٠,٠٠٠١٦'],a:2},
{q:`ناتج ${X('(٢ × ٢) + (٢ × ٠,٢) + (٢ × ٠,٠٢)')}`,o:['٤,٤٤','٤٤,٤','٠,٤٤٤','٤٤٤'],a:0},
{q:`ناتج ${F('٠,١','٠,٠٠٠١')} + ${F('٠,١','٠,٠٠١')} + ${F('٠,٠٠١','٠,٠٠٠١')} = ……`,o:['١٠١١','١١٠١','١١١٠','١١١١'],a:2},
{q:`ناتج ${F('١','٥')} + ${F('١','٤')} + ${F('٤','٥')} + ${F('٣','٤')} = ……`,o:['٢','٣','٥','٤'],a:0},
{q:`ناتج طرح ${X('٨ − ٠,٠٠٧')}`,o:['٧,٩٩٣','٨,٩٩٠','٩,٨٤٢','٨,٠٠٩'],a:0},
{q:`ناتج ${X('٠,١٠٣ + ٠,٠٥٠ + ٣,٠٠٥')}`,o:['١,٥٣٨','٣,١٥٨','٣,٠٥٥','٥,٠٠٣'],a:1},
{q:`ناتج العملية ${X('٤ (١٥٠ − ٥٠) + ٥ × ١٠٠')}`,o:['٥٠٠','٤٠٠','٩٠٠','١٠٠٠'],a:2},
{q:`ناتج قسمة ${X('١٧٠٩٦٩٠ ÷ ٣٨٤٢')}`,o:['٤٤٥','٦٢٧','٤٩٩','٥٢٧'],a:0},
{q:`يستخدم كأس سعته ٠,٠٠٥ متر مكعب ليملأ إناءً سعته ٥ متر مكعب، فكم كأسًا سوف يحتاج؟`,o:['١٠٠٠٠','١٠٠٠','١٠٠','١٠'],a:1},
{q:`أراد رجل ملء خزان سيارته بالوقود بمبلغ ٨١ ريالًا، فإذا كان سعر لتر البنزين ٠,٩ ريال، فما عدد اللترات؟`,o:['٩','٩٠','٨١٠','٩٠٠'],a:1},
{q:`أيّ من الأعداد الآتية يقبل القسمة على ١١ ولا يقبل القسمة على ٤؟`,o:['٢٥٠٠','٢١٨٩','٤٤','٢٢٨٨'],a:1},
{q:`العدد <bdi dir="ltr">٨٧٥٣٩س٤</bdi> يقبل القسمة على ٤ إذا وُضع مكان س العدد:`,o:['٥','٤','٣','٧'],a:1},
{q:`إذا كان المتوسط لـ ٥ أعداد زوجية متتالية هو ١٢، فما أكبرها؟`,o:['١٤','١٦','١٨','٢٠'],a:1},
{q:`إذا كان المتوسط لـ ٦ أعداد فردية متتالية هو ٨، فما أصغرها؟`,o:['٥','٣','٧','٩'],a:1},
{q:`أوجد المتوسط للقيم ١ ، ٢ ، ٣ ، ٤ ، ٥`,o:['٥','٢','٤','٣'],a:3},
{q:`إذا كان متوسط القيم ١١ ، ٢٤ ، ٩ ، س هو ١٥، أوجد ${X('٩ + ١١ + ٢٤ + س')}`,o:['٥٠','٧٠','١٠٠','٦٠'],a:3},
{q:`أوجد مجموع عشرة أعداد متوسطها الحسابي = ٦٠`,o:['٦١٠','٦٢٠','٥٦٠','٦٠٠'],a:3},
{q:`إذا كان متوسط أعمار خمسة إخوة ١٢ عامًا، ومتوسط أعمار الثلاثة الكبار منهم ١٥ عامًا، فما متوسط أعمار الاثنين الصغار؟`,o:['٧','٦','٧,٥','٨'],a:2},
{q:`إذا كان المتوسط الحسابي لـ ٦ أعداد يساوي ٢٠، وكان متوسط عددين منهم يساوي ٥٠، فما متوسط الأربعة المتبقية؟`,o:['٥','٤','٦','٧'],a:0},
{group:`<h3>استخدم الرسم للإجابة عن الأسئلة التالية:</h3>الدائرة المظللة في المنتصف تمثل المعاقين وعددهم ٥ طلاب.<div class="fig">${pieSchool}</div>`},
{q:`ما قياس زاوية قطاع طلاب الصف الثاني الثانوي «شرعي» تقريبًا؟`,o:['٣٢°','٤٢°','٤٤°','٥٤°'],a:0},
{q:`أوجد مجموع طلاب القسم العلمي (الطبيعي).`,o:['١٠٠','١٩٥','١٥٠','٢٠٥'],a:1},
{q:`أيّ الآتي صحيح؟`,one:1,o:['مجموع طلاب ثاني ثانوي أكبر من مجموع طلاب ثالث ثانوي','عدد طلاب ثالث ثانوي شرعي أقل من عدد طلاب ثاني ثانوي شرعي','مجموع طلاب ثاني ثانوي علمي يساوي مجموع طلاب ثالث ثانوي علمي','عدد طلاب ثالث ثانوي شرعي يساوي عدد طلاب ثاني ثانوي شرعي'],a:0},
{q:`عند إضافة ١٥ طالبًا للمرحلة كم يكون مجموع عدد الطلاب؟`,o:['٥٠٠','٥١٥','٥٢٠','٥١٠'],a:1},
{q:`أوجد مساحة قطاع الصف الأول الثانوي تقريبًا إذا كانت مساحة الدائرة ٨١`,o:['٤٨,٩','٣٢,٤','٣٧','٤٠'],a:1},
{q:`أيّ الآتي أكبر؟`,one:1,o:['ثالث شرعي وثاني شرعي','ثاني ثانوي «علمي وشرعي»','ثاني علمي وثالث علمي','ثالث ثانوي «علمي وشرعي»'],a:2},
{q:`كم يصبح عدد طلاب ثاني ثانوي علمي إذا أضفنا لهم ثلثي طلاب ثاني ثانوي شرعي؟`,o:['١٣٥','١٥٠','٢٠٠','١٠٠'],a:0},
{q:`عددان فرديان متتاليان مجموعهما = ٤٨، فأوجد العدد الأكبر.`,o:['٢٥','٢٧','١٩','٢٣'],a:0},
{q:`أوجد قياس زاوية القطاع المجهول.<div class="fig">${pieFrac}</div>`,o:['١٨٠°','١٤٤°','١٥٠°','٣٦٠°'],a:1},
{q:`ما نسبة السعوديين؟<div class="fig">${pieNat}</div>`,o:['٧٥٪','٥٠٪','٢٥٪','٤٠٪'],a:0},
{q:`في الجدول المقابل، ما نسبة الطلاب الذين تتراوح أطوالهم بين ١٧٠ – ١٧٩ سم تقريبًا؟${tblHeight}`,o:['٧٠٪','٦٥٪','٥٨٪','٥٠٪'],a:2},
{q:`متوسط النقل الخفيف في الأيام الأربعة:<div class="fig">${barTrans}</div>`,o:['٧٠','٦٥','٤٥','٨٠'],a:0},
{q:`${tblHobby}ما نسبة الرجال الذين يفضلون القراءة والسباحة؟`,o:['٥٠٪','٦٠٪','٧٠٪','٨٠٪'],a:1},
{q:`من الرسم البياني المجاور: ما السنة التي تجاوزت فيها النفقات الإيرادات؟<div class="fig">${barCo2}</div>`,o:['١٩٩٧','١٩٩٩','١٩٩٨','٢٠٠٠'],a:3},
];

const L=['أ','ب','ج','د'],hi=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const box=document.getElementById('quiz');let n=0;const items=[];
Q.forEach(it=>{
  if(it.group){const g=document.createElement('div');g.className='card group';g.innerHTML=it.group;box.appendChild(g);return}
  n++;const i=items.length;items.push(it);
  const c=document.createElement('div');c.className='card q';c.id='q'+i;
  c.innerHTML=`<div class="head"><span class="num">${hi(n)}</span><div class="qt">${it.q}</div></div>
  <div class="opts${it.one?' one':''}">${it.o.map((t,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}"><span class="l">${L[j]}</span><span>${t}</span></label>`).join('')}</div><div class="fb"></div>`;
  box.appendChild(c);
});
document.getElementById('qc').textContent=hi(items.length);
const prog=()=>{const k=document.querySelectorAll('#quiz input:checked').length;document.getElementById('prog').textContent=`تمت الإجابة على ${hi(k)} من ${hi(items.length)}`};
box.addEventListener('change',e=>{if(e.target.type!=='radio')return;
  e.target.closest('.opts').querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel',o.contains(e.target)));prog()});
prog();
let done=false,warned=false;
document.getElementById('submit').onclick=()=>{
  if(done)return;
  const k=document.querySelectorAll('#quiz input:checked').length;
  if(k<items.length && !warned){warned=true;document.getElementById('prog').innerHTML=`<b style="color:#c62828">لم تُجب عن ${hi(items.length-k)} سؤالًا — اضغط «إنهاء» مرة أخرى للتأكيد</b>`;return}
  done=true;let s=0;document.body.classList.add('done');
  items.forEach((it,i)=>{const c=document.getElementById('q'+i),ch=c.querySelector('input:checked'),opts=c.querySelectorAll('.opt'),fb=c.querySelector('.fb');
    c.querySelectorAll('input').forEach(x=>x.disabled=true);
    opts[it.a].classList.add('ok');
    if(ch&&+ch.value===it.a){s++;fb.className='fb ok';fb.textContent='✓ إجابة صحيحة'}
    else{if(ch)opts[+ch.value].classList.add('bad');fb.className='fb bad';fb.textContent=`✗ الإجابة الصحيحة: (${L[it.a]})`}
  });
  const p=Math.round(s/items.length*100),r=document.getElementById('result');
  document.getElementById('rname').textContent=(document.getElementById('nm').value.trim()||'نتيجتك');
  document.getElementById('score').textContent=`${hi(s)} / ${hi(items.length)}`;
  document.getElementById('rmsg').textContent=`النسبة: ${hi(p)}٪ — `+(p>=90?'ممتاز! أداء رائع':p>=75?'جيد جدًا، استمر':p>=50?'جيد، راجع الأسئلة الخاطئة':'تحتاج إلى مراجعة الدروس');
  r.style.display='block';r.scrollIntoView({behavior:'smooth'});
};
document.getElementById('reset').onclick=()=>location.reload();
</script>
</body>
</html>
